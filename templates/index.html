<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 25px; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px; border-radius: 12px; margin-bottom: 15px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .status { font-weight: bold; color: var(--tg-theme-button-color, #2481cc); }
        .btn {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 14px; border-radius: 10px;
            width: 100%; font-weight: bold; cursor: pointer; font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>NuviraByteCore</h2>
            <p>Панель управления ссылками</p>
        </div>
        <div id="links">
            <div class="card">
                <p>Все системы работают штатно.</p>
                <p class="status">Мониторинг: Активен</p>
            </div>
        </div>
        <button class="btn" onclick="window.Telegram.WebApp.close()">Вернуться в чат</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
